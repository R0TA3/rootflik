<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreeStream – Movies & Series</title>

  <!-- Bootstrap 5 (lightweight, responsive) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ===== GLOBAL ===== */
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0c10;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1c23; }
    ::-webkit-scrollbar-thumb { background: #3a3d4a; border-radius: 4px; }
    a { color: #e50914; text-decoration: none; }
    a:hover { color: #ff3d47; }

    /* ===== HEADER ===== */
    .app-header {
      background: linear-gradient(135deg, #0f1117 0%, #1a1c28 100%);
      border-bottom: 1px solid #2a2d3a;
      padding: 12px 0;
      position: sticky;
      top: 0; z-index: 1000;
      backdrop-filter: blur(12px);
    }
    .app-header .brand {
      font-weight: 800;
      font-size: 1.6rem;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .app-header .brand span { color: #e50914; }
    .app-header .form-control {
      background: #1e202b;
      border: 1px solid #333640;
      color: #fff;
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 0.9rem;
      max-width: 420px;
      width: 100%;
    }
    .app-header .form-control:focus {
      background: #252836;
      border-color: #e50914;
      box-shadow: 0 0 0 2px rgba(229,9,20,0.25);
      color: #fff;
    }
    .app-header .form-control::placeholder { color: #6b6e7c; }
    .search-btn {
      background: #e50914;
      border: none;
      border-radius: 30px;
      padding: 8px 22px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      transition: all 0.2s;
    }
    .search-btn:hover { background: #ff1f2a; transform: scale(1.02); }

    /* ===== NAV TABS ===== */
    .nav-tabs-custom {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 16px 0 8px;
    }
    .nav-tabs-custom .tab-btn {
      background: #1e202b;
      color: #9ea0ab;
      border: 1px solid #2e3140;
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-tabs-custom .tab-btn:hover {
      background: #2a2d3a;
      color: #fff;
    }
    .nav-tabs-custom .tab-btn.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    /* ===== MOVIE CARDS ===== */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      padding: 0 0 30px;
    }
    .movie-card {
      background: #14161e;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      cursor: pointer;
      border: 1px solid #252836;
      position: relative;
    }
    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      border-color: #e50914;
    }
    .movie-card .poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #1a1c23;
      display: block;
    }
    .movie-card .info {
      padding: 10px 12px 12px;
    }
    .movie-card .title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #fff;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .movie-card .year {
      font-size: 0.75rem;
      color: #6b6e7c;
      margin-top: 4px;
    }
    .movie-card .badge-type {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(229,9,20,0.85);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .movie-card .rating {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.75);
      color: #f5c518;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ===== PLAYER PAGE ===== */
    .player-wrapper {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 80vh;
    }
    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .player-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    .player-controls .server-btn {
      background: #1e202b;
      border: 1px solid #333640;
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #9ea0ab;
      transition: all 0.2s;
      cursor: pointer;
    }
    .player-controls .server-btn:hover,
    .player-controls .server-btn.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }
    .player-controls .server-btn i { margin-right: 4px; }

    /* ===== EPISODE SELECTOR ===== */
    .episode-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding: 8px;
      background: #14161e;
      border-radius: 8px;
    }
    .episode-grid .ep-btn {
      background: #1e202b;
      border: 1px solid #333640;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: #9ea0ab;
      cursor: pointer;
      transition: all 0.15s;
    }
    .episode-grid .ep-btn:hover,
    .episode-grid .ep-btn.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    /* ===== BACK BUTTON ===== */
    .back-btn {
      background: transparent;
      border: 1px solid #333640;
      color: #9ea0ab;
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.85rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .back-btn:hover { background: #2a2d3a; color: #fff; border-color: #e50914; }

    /* ===== RESPONSIVE TWEAKS ===== */
    @media (max-width: 576px) {
      .app-header .brand { font-size: 1.2rem; }
      .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .movie-card .info { padding: 6px 8px 10px; }
      .movie-card .title { font-size: 0.78rem; }
      .player-wrapper { aspect-ratio: 16/9; border-radius: 8px; }
      .nav-tabs-custom .tab-btn { font-size: 0.7rem; padding: 4px 12px; }
    }
    @media (min-width: 577px) and (max-width: 768px) {
      .movie-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .movie-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    }
    @media (min-width: 1025px) and (max-width: 1440px) {
      .movie-grid { grid-template-columns: repeat(5, 1fr); }
    }
    @media (min-width: 1441px) {
      .movie-grid { grid-template-columns: repeat(6, 1fr); max-width: 1600px; margin: 0 auto; }
    }

    /* ===== LOADING ===== */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333640;
      border-top: 3px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MISC ===== */
    .section-title {
      font-weight: 700;
      font-size: 1.3rem;
      color: #fff;
      margin: 20px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title i { color: #e50914; font-size: 1.1rem; }
    .text-muted-custom { color: #6b6e7c; }
    .detail-section { background: #14161e; border-radius: 12px; padding: 18px; border: 1px solid #252836; }
    .detail-section h2 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .detail-section .overview { font-size: 0.9rem; color: #b0b2bd; line-height: 1.6; }
    .footer-note { text-align: center; padding: 30px 0 20px; color: #4a4d5a; font-size: 0.75rem; }
    .footer-note a { color: #6b6e7c; }
    #mainContent { min-height: 70vh; }
  </style>
</head>
<body>

  <!-- ===== HEADER / SEARCH ===== -->
  <header class="app-header">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-auto d-none d-sm-block">
          <a href="#" onclick="showHome(); return false;" class="brand">Free<span>Stream</span></a>
        </div>
        <div class="col d-flex justify-content-center">
          <form onsubmit="handleSearch(event); return false;" class="d-flex gap-2 w-100" style="max-width:500px;">
            <input type="text" id="searchInput" class="form-control" placeholder="Search movies & series..." autocomplete="off" />
            <button type="submit" class="search-btn"><i class="bi bi-search"></i></button>
          </form>
        </div>
        <div class="col-auto d-sm-none">
          <a href="#" onclick="showHome(); return false;" class="brand" style="font-size:1.1rem;">F<span>S</span></a>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== TAB NAVIGATION ===== -->
  <div class="container">
    <div class="nav-tabs-custom">
      <button class="tab-btn active" data-tab="trending" onclick="loadTab('trending')">🔥 Trending</button>
      <button class="tab-btn" data-tab="now_playing" onclick="loadTab('now_playing')">🎬 Now Playing</button>
      <button class="tab-btn" data-tab="top_rated_movie" onclick="loadTab('top_rated_movie')">⭐ Top Rated</button>
      <button class="tab-btn" data-tab="popular_movie" onclick="loadTab('popular_movie')">📈 Popular</button>
      <button class="tab-btn" data-tab="popular_tv" onclick="loadTab('popular_tv')">📺 Series</button>
      <button class="tab-btn" data-tab="on_the_air" onclick="loadTab('on_the_air')">🆕 On Air</button>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="container" id="mainContent">
    <div class="d-flex justify-content-center align-items-center" style="min-height:50vh;">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="footer-note">
    <div class="container">
      <p class="mb-0">
        <i class="bi bi-film"></i> FreeStream &mdash; Free Movies &amp; Series Streaming<br class="d-sm-none" />
        <span class="d-none d-sm-inline">&bull;</span>
        Data via TMDB &bull; Playback via open embed sources
      </p>
    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    // ================================================================
    //  CONFIGURATION
    // ================================================================
    const TMDB_KEY   = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI3NjVmODYxMTU4MGFlYTJkOWQyYTIzOTI1M2QxNTZlMyIsIm5iZiI6MTc4NzQwNjI4My4zMDQ5OTk4LCJzdWIiOiI2YTg5YTdjYjM5OTFlODJlYmEzZWM3M2EiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.wmtQsvI0LKEkhVR1BmcyNf6iFT10nOmmofS77kbMh4k';  // free public TMDB key
    const TMDB_BASE  = 'https://api.themoviedb.org/3';
    const IMG_BASE   = 'https://image.tmdb.org/t/p/w342';

    // Multiple embed servers (fallback chain)
    const EMBED_SERVERS = [
      { name: 'VidSrc',   url: (id, type, s, ep) => `https://vidsrc.sbs/embed/${type}/${id}${s && ep ? `/${s}/${ep}` : ''}` },
      { name: 'VidSrc To', url: (id, type, s, ep) => `https://vidsrc.to/embed/${type}/${id}${s && ep ? `/${s}/${ep}` : ''}` },
      { name: 'Embed SU', url: (id, type, s, ep) => `https://embed.su/embed/${type}/${id}${s && ep ? `/${s}/${ep}` : ''}` },
    ];

    let currentTab    = 'trending';
    let currentPage   = 1;
    let isLoading     = false;
    let currentMovieId = null;
    let currentMediaType = 'movie';
    let currentSeason = 1;
    let currentEpisode = 1;
    let currentEmbedIndex = 0;
    let movieCache    = {};  // simple cache

    // ================================================================
    //  DOM REFS
    // ================================================================
    const mainEl = document.getElementById('mainContent');
    const searchInput = document.getElementById('searchInput');

    // ================================================================
    //  API: TMDB FETCH
    // ================================================================
    async function tmdbFetch(endpoint, params = {}) {
      const qs = new URLSearchParams({ api_key: TMDB_KEY, language: 'en-US', ...params }).toString();
      const url = `${TMDB_BASE}${endpoint}?${qs}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`TMDB error ${res.status}`);
      return res.json();
    }

    // ================================================================
    //  HOME / TAB LOADING
    // ================================================================
    async function showHome() {
      currentTab = 'trending';
      currentPage = 1;
      highlightTab('trending');
      await loadTab('trending');
    }

    async function loadTab(tab) {
      currentTab = tab;
      currentPage = 1;
      highlightTab(tab);
      mainEl.innerHTML = `<div class="spinner"></div>`;

      try {
        let data;
        switch(tab) {
          case 'trending':
            data = await tmdbFetch('/trending/all/week');
            renderGrid(data.results, 'Trending This Week');
            break;
          case 'now_playing':
            data = await tmdbFetch('/movie/now_playing');
            renderGrid(data.results, 'Now Playing');
            break;
          case 'top_rated_movie':
            data = await tmdbFetch('/movie/top_rated');
            renderGrid(data.results, 'Top Rated Movies');
            break;
          case 'popular_movie':
            data = await tmdbFetch('/movie/popular');
            renderGrid(data.results, 'Popular Movies');
            break;
          case 'popular_tv':
            data = await tmdbFetch('/tv/popular');
            renderGrid(data.results, 'Popular Series');
            break;
          case 'on_the_air':
            data = await tmdbFetch('/tv/on_the_air');
            renderGrid(data.results, 'Currently On Air');
            break;
          default:
            data = await tmdbFetch('/trending/all/week');
            renderGrid(data.results, 'Trending');
        }
      } catch(e) {
        mainEl.innerHTML = `<div class="alert alert-danger mt-4">Failed to load. Check your internet or TMDB key.</div>`;
        console.error(e);
      }
    }

    function highlightTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
    }

    // ================================================================
    //  RENDER GRID
    // ================================================================
    function renderGrid(items, title) {
      if (!items || items.length === 0) {
        mainEl.innerHTML = `<div class="text-center text-muted-custom mt-5"><i class="bi bi-camera-reels fs-1"></i><p class="mt-2">No results found.</p></div>`;
        return;
      }

      let html = `<div class="section-title"><i class="bi bi-film"></i> ${title}</div><div class="movie-grid">`;

      items.forEach(item => {
        const id   = item.id;
        const type = item.media_type || (item.title ? 'movie' : 'tv');
        const titleText = item.title || item.name || 'Unknown';
        const year = (item.release_date || item.first_air_date || '').substring(0,4);
        const poster = item.poster_path ? IMG_BASE + item.poster_path : 'https://via.placeholder.com/300x450/1a1c23/6b6e7c?text=No+Poster';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
        const typeLabel = type === 'movie' ? 'Movie' : 'Series';

        html += `
          <div class="movie-card" onclick="openPlayer(${id}, '${type}', '${titleText.replace(/'/g, "\\'")}')">
            <img class="poster" src="${poster}" alt="${titleText}" loading="lazy" />
            <div class="badge-type">${typeLabel}</div>
            ${rating ? `<div class="rating"><i class="bi bi-star-fill"></i> ${rating}</div>` : ''}
            <div class="info">
              <div class="title">${titleText}</div>
              ${year ? `<div class="year">${year}</div>` : ''}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      mainEl.innerHTML = html;
    }

    // ================================================================
    //  SEARCH
    // ================================================================
    async function handleSearch(e) {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      mainEl.innerHTML = `<div class="spinner"></div>`;
      try {
        const data = await tmdbFetch('/search/multi', { query });
        const filtered = (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv');
        if (filtered.length === 0) {
          mainEl.innerHTML = `<div class="text-center text-muted-custom mt-5"><i class="bi bi-search fs-1"></i><p class="mt-2">No results for "${query}"</p></div>`;
        } else {
          renderGrid(filtered, `Results for "${query}"`);
        }
      } catch(e) {
        mainEl.innerHTML = `<div class="alert alert-danger mt-4">Search failed.</div>`;
      }
    }

    // ================================================================
    //  OPEN PLAYER
    // ================================================================
    async function openPlayer(id, type, title) {
      currentMovieId = id;
      currentMediaType = type;
      currentEmbedIndex = 0;
      currentSeason = 1;
      currentEpisode = 1;

      mainEl.innerHTML = `<div class="spinner"></div>`;

      try {
        let details;
        if (type === 'movie') {
          details = await tmdbFetch(`/movie/${id}`);
        } else {
          details = await tmdbFetch(`/tv/${id}`);
        }
        renderPlayer(details, type, title);
      } catch(e) {
        mainEl.innerHTML = `<div class="alert alert-danger mt-4">Failed to load details.</div>`;
      }
    }

    // ================================================================
    //  RENDER PLAYER PAGE
    // ================================================================
    function renderPlayer(details, type, title) {
      const poster = details.poster_path ? IMG_BASE + details.poster_path : '';
      const year = (details.release_date || details.first_air_date || '').substring(0,4);
      const overview = details.overview || 'No description available.';
      const genres = (details.genres || []).map(g => g.name).join(', ') || 'N/A';
      const rating = details.vote_average ? details.vote_average.toFixed(1) : '';
      const name = details.title || details.name || title;
      const id = details.id;

      // For series, get number of seasons
      const seasons = details.seasons || [];
      const totalSeasons = seasons.length;

      // Build embed URL for current server + season/episode
      const server = EMBED_SERVERS[currentEmbedIndex];
      const embedType = type === 'movie' ? 'movie' : 'tv';
      let embedUrl;
      if (type === 'movie') {
        embedUrl = server.url(id, embedType, null, null);
      } else {
        embedUrl = server.url(id, embedType, currentSeason, currentEpisode);
      }

      // Build episode selector for series
      let episodeHtml = '';
      if (type === 'tv') {
        const totalEps = details.number_of_episodes || 20;
        episodeHtml = `
          <div class="mt-3">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <label class="text-muted-custom small">Season:</label>
              <select id="seasonSelect" class="form-select form-select-sm" style="width:auto;background:#1e202b;color:#fff;border-color:#333640;" onchange="changeSeason(${id})">
                ${seasons.filter(s => s.season_number > 0).map(s =>
                  `<option value="${s.season_number}" ${s.season_number === currentSeason ? 'selected' : ''}>${s.season_number}</option>`
                ).join('')}
              </select>
              <label class="text-muted-custom small ms-2">Episode:</label>
            </div>
            <div class="episode-grid" id="episodeGrid">
              ${Array.from({length: Math.min(totalEps, 60)}, (_, i) =>
                `<button class="ep-btn ${i+1 === currentEpisode ? 'active' : ''}" onclick="changeEpisode(${id}, ${i+1})">${i+1}</button>`
              ).join('')}
            </div>
          </div>
        `;
      }

      const serverButtons = EMBED_SERVERS.map((s, i) =>
        `<button class="server-btn ${i === currentEmbedIndex ? 'active' : ''}" onclick="switchServer(${i})">
          <i class="bi bi-server"></i> ${s.name}
        </button>`
      ).join('');

      const html = `
        <!-- Back button -->
        <div class="mt-3 mb-3">
          <button class="back-btn" onclick="showHome()"><i class="bi bi-arrow-left"></i> Back</button>
        </div>

        <!-- Player -->
        <div class="row">
          <div class="col-12">
            <div class="player-wrapper">
              <iframe
                src="${embedUrl}"
                allowfullscreen
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write"
                loading="lazy"
                title="${name}"
              ></iframe>
            </div>
            <div class="player-controls">
              <span class="text-muted-custom small me-2"><i class="bi bi-hdd-stack"></i> Server:</span>
              ${serverButtons}
            </div>
            ${type === 'tv' ? episodeHtml : ''}
          </div>
        </div>

        <!-- Details -->
        <div class="row mt-4">
          <div class="col-md-9">
            <div class="detail-section">
              <div class="d-flex align-items-start gap-3">
                ${poster ? `<img src="${poster}" alt="${name}" style="width:90px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;flex-shrink:0;display:none;" class="d-md-block" />` : ''}
                <div class="flex-grow-1">
                  <h2>${name} <span class="fs-6 fw-normal text-muted-custom">${year ? `(${year})` : ''}</span></h2>
                  <div class="d-flex flex-wrap gap-3 mb-2 small">
                    ${rating ? `<span><i class="bi bi-star-fill" style="color:#f5c518;"></i> ${rating}</span>` : ''}
                    <span><i class="bi bi-tag-fill" style="color:#e50914;"></i> ${genres}</span>
                    <span><i class="bi bi-collection-fill" style="color:#e50914;"></i> ${type === 'movie' ? 'Movie' : 'Series'}</span>
                  </div>
                  <p class="overview">${overview}</p>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3 mt-3 mt-md-0">
            <div class="detail-section text-center">
              <div class="small text-muted-custom mb-1"><i class="bi bi-play-circle"></i> Having issues?</div>
              <p class="small text-muted-custom mb-0">Try switching servers above. If the player shows a blank screen, click a different server button.</p>
            </div>
          </div>
        </div>
      `;

      mainEl.innerHTML = html;
    }

    // ================================================================
    //  SWITCH EMBED SERVER
    // ================================================================
    function switchServer(index) {
      currentEmbedIndex = index;
      // Re-render player with new server
      const id = currentMovieId;
      const type = currentMediaType;
      const server = EMBED_SERVERS[index];
      const embedType = type === 'movie' ? 'movie' : 'tv';
      let embedUrl;
      if (type === 'movie') {
        embedUrl = server.url(id, embedType, null, null);
      } else {
        embedUrl = server.url(id, embedType, currentSeason, currentEpisode);
      }

      const iframe = document.querySelector('.player-wrapper iframe');
      if (iframe) {
        iframe.src = embedUrl;
      }

      // Update active button style
      document.querySelectorAll('.server-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
    }

    // ================================================================
    //  CHANGE SEASON / EPISODE (Series only)
    // ================================================================
    async function changeSeason(id) {
      const season = parseInt(document.getElementById('seasonSelect').value);
      currentSeason = season;
      currentEpisode = 1;

      // Fetch season details to get episode count
      try {
        const seasonData = await tmdbFetch(`/tv/${id}/season/${season}`);
        const episodes = seasonData.episodes || [];
        updateEpisodeGrid(episodes);
        // Reload player
        switchServer(currentEmbedIndex);
      } catch(e) {
        // fallback: reload player anyway
        switchServer(currentEmbedIndex);
      }
    }

    function changeEpisode(id, ep) {
      currentEpisode = ep;
      document.querySelectorAll('.ep-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.textContent) === ep);
      });
      switchServer(currentEmbedIndex);
    }

    function updateEpisodeGrid(episodes) {
      const grid = document.getElementById('episodeGrid');
      if (!grid) return;
      grid.innerHTML = episodes.map(ep =>
        `<button class="ep-btn ${ep.episode_number === currentEpisode ? 'active' : ''}" onclick="changeEpisode(${currentMovieId}, ${ep.episode_number})">${ep.episode_number}</button>`
      ).join('');
    }

    // ================================================================
    //  KEYBOARD SHORTCUT: ENTER TO SEARCH
    // ================================================================
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSearch(e);
      }
    });

    // ================================================================
    //  INIT: LOAD TRENDING ON START
    // ================================================================
    document.addEventListener('DOMContentLoaded', () => {
      showHome();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
