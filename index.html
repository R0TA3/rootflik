<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>RootFlik — Free Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:#09090b;color:#f1f1f3;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#32323c;border-radius:4px}
a{text-decoration:none;color:inherit}
img{display:block}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:800;background:rgba(9,9,11,.97);backdrop-filter:blur(18px);border-bottom:1px solid #28282f}
.nav-inner{height:54px;display:flex;align-items:center;gap:10px;padding:0 clamp(10px,2.5vw,28px)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:5px;color:#e50914;flex-shrink:0;cursor:pointer;user-select:none;filter:drop-shadow(0 0 10px rgba(229,9,20,.4))}
.srch-wrap{flex:1;max-width:400px;margin:0 auto}
.srch-wrap input{width:100%;background:#18181d;border:1.5px solid #32323c;border-radius:22px;color:#f1f1f3;font-family:'Nunito',sans-serif;font-size:.81rem;font-weight:700;padding:7px 38px 7px 15px;outline:none}
.srch-wrap input:focus{border-color:#e50914}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 clamp(10px,2.5vw,28px) 7px}
.nav-tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:none;border:none;color:#888898;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:800;padding:5px 13px;border-radius:18px;transition:all .18s;white-space:nowrap}
.tab:hover{color:#f1f1f3;background:#18181d}
.tab.on{color:#fff;background:#e50914}

/* SECTION TABS */
.sec-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:.65rem clamp(10px,2.5vw,28px) .3rem;margin-top:var(--nav,106px)}
.sec-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;background:#18181d;border:1.5px solid #28282f;color:#888898;padding:5px 13px;border-radius:18px;font-family:'Nunito',sans-serif;font-size:.71rem;font-weight:800;cursor:pointer;transition:all .18s;white-space:nowrap}
.stab:hover,.stab.on{background:#e50914;border-color:#e50914;color:#fff}

/* MOVIE GRID */
.grid-wrap{padding:0 clamp(10px,2.5vw,28px) 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(max-width:576px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media(min-width:577px)and(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:901px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

.card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .22s,box-shadow .22s;background:#111115}
.card:hover{transform:scale(1.05) translateY(-4px);z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.7)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover}
.card-info{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.3) 55%,transparent 80%);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;justify-content:flex-end;padding:9px}
.card:hover .card-info{opacity:1}
.card-title{font-size:.7rem;font-weight:800;line-height:1.3}
.card-year{font-size:.6rem;color:#888898;margin-top:2px}
.card-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:44px;height:44px;border-radius:50%;background:rgba(229,9,20,.95);display:flex;align-items:center;justify-content:center;font-size:1rem;transition:transform .2s;box-shadow:0 0 22px rgba(229,9,20,.55);pointer-events:none}
.card:hover .card-play{transform:translate(-50%,-50%) scale(1)}
.card-badge{position:absolute;top:6px;left:6px;background:#e50914;color:#fff;font-size:.48rem;font-weight:900;padding:2px 6px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;z-index:6}

/* SECTION HEADER */
.sh{display:flex;align-items:center;padding:0 clamp(10px,2.5vw,28px);margin:16px 0 10px}
.st{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:2px;color:#fff}

/* PLAYER PAGE */
#pg-player{display:none;position:fixed;inset:0;z-index:1500;background:#09090b;overflow-y:auto}
#pg-player.on{display:block}
.p-top{display:flex;align-items:center;gap:10px;padding:12px clamp(10px,3vw,32px);background:rgba(9,9,11,.96);border-bottom:1px solid #28282f;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);flex-wrap:wrap}
.p-back{background:#18181d;border:1.5px solid #32323c;color:#f1f1f3;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.78rem;font-weight:800;transition:all .18s;white-space:nowrap}
.p-back:hover{background:#e50914;border-color:#e50914}
.p-title{flex:1;min-width:0}
.p-title h2{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title p{font-size:.68rem;color:#888898;font-weight:700}

/* IFRAME WRAPPER WITH OVERLAY BLOCK */
.vwrap{position:relative;width:100%;background:#000}
.vwrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
.ov-t{position:absolute;top:0;left:0;right:0;height:36px;z-index:5;pointer-events:all}
.ov-b{position:absolute;bottom:0;left:0;right:0;height:36px;z-index:5;pointer-events:all}
.ov-l{position:absolute;top:36px;bottom:36px;left:0;width:24px;z-index:5;pointer-events:all}
.ov-r{position:absolute;top:36px;bottom:36px;right:0;width:24px;z-index:5;pointer-events:all}

.source-bar{display:flex;align-items:center;gap:8px;padding:10px clamp(10px,3vw,32px);background:#111115;border-bottom:1px solid #28282f;flex-wrap:wrap}
.sl{font-size:.7rem;font-weight:900;color:#888898;letter-spacing:.5px;text-transform:uppercase}
.src-btn{background:#18181d;border:1.5px solid #32323c;color:#888898;padding:5px 13px;border-radius:6px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.71rem;font-weight:800;transition:all .18s;white-space:nowrap}
.src-btn:hover{border-color:#e50914;color:#f1f1f3}
.src-btn.on{background:#e50914;border-color:#e50914;color:#fff}

.ep-bar{display:flex;align-items:center;gap:8px;padding:10px clamp(10px,3vw,32px);background:#18181d;border-bottom:1px solid #28282f;flex-wrap:wrap}
.ep-sel{background:#111115;border:1.5px solid #32323c;color:#f1f1f3;padding:6px 12px;border-radius:6px;font-family:'Nunito',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;outline:none}
.ep-nav{background:#18181d;border:1.5px solid #32323c;color:#888898;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:800}
.ep-nav:hover{border-color:#e50914;color:#f1f1f3}
.ep-nav.nx{background:#e50914;border-color:#e50914;color:#fff}

/* BOTTOM NAV MOBILE */
#bnav{display:none}
@media(max-width:768px){
  :root{--nav:98px}
  #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:900;background:rgba(9,9,11,.98);border-top:1px solid #28282f;padding:6px 0 max(6px,env(safe-area-inset-bottom));justify-content:space-around}
  .bn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#888898;font-family:'Nunito',sans-serif;font-size:.5rem;font-weight:800;padding:4px 5px;cursor:pointer;min-width:44px}
  .bn .bi{font-size:1.2rem}
  .bn.on{color:#e50914}
  .nav-tabs{display:none}
  .sec-tabs{margin-top:98px}
  body{padding-bottom:60px}
}
</style>
</head>

<!-- ===== POPUP BLOCKER ===== -->
<script>
(function(){
  try{window._realOpen=window.open;Object.defineProperty(window,'open',{value:function(u){if(u&&(u.includes('youtube.com')||u.includes('youtu.be'))){try{return window._realOpen(u)}catch(e){}}return null},writable:false,configurable:false})}catch(e){}
  window.addEventListener('beforeunload',function(e){e.preventDefault();e.returnValue=''},false);
  let _ll=location.href;
  setInterval(function(){if(location.href!==_ll){const e=document.activeElement;if(!e||!e.closest){_ll=location.href;return}const s=e.closest('.tab')||e.closest('.bn')||e.closest('.p-back')||e.closest('.logo')||e.closest('.card');if(!s)history.pushState(null,'',_ll);_ll=location.href}},300);
  new MutationObserver(function(m){for(const x of m){if(x.type==='childList'){for(const n of x.addedNodes){if(n.tagName==='SCRIPT'&&n.src&&['popad','popunder','adserver','exoclick'].some(d=>n.src.includes(d)))n.remove();if(n.tagName==='IFRAME'&&n.src&&!n.id){const a=['vidsrc.sbs','vidcore.org','vidsrc.cc','vidsrc.pm','2embed.skin','youtube.com'];if(!a.some(d=>n.src.includes(d))&&!n.closest('.vwrap'))n.remove()}}}}}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

  {id:110,title:"Sherlock",year:2010,type:"series",poster:"https://image.tmdb.org/t/p/w342/7PHnef7G4SWjd4SJA6vW4i8nG3T.jpg",embed:"tt1475582",seasons:4,eps:[3,3,3,3]},
  {id:111,title:"Dark",year:2017,type:"series",poster:"https://image.tmdb.org/t/p/w342/4NDfd9fUPs4Q7yCbM2C4jemNqy1.jpg",embed:"tt5753856",seasons:3,eps:[10,8,8]},
  {id:112,title:"The Mandalorian",year:2019,type:"series",poster:"https://image.tmdb.org/t/p/w342/eoO1F1nYmiowFi7UZIBFIwXSCBC.jpg",embed:"tt8111088",seasons:3,eps:[8,8,8]},
];

// ===== EMBED SERVERS =====
const SRV = [
  (id,mt,s,e) => mt==='tv' ? `https://vidsrc.sbs/embed/tv/${id}/${s}/${e}` : `https://vidsrc.sbs/embed/movie/${id}`,
  (id,mt,s,e) => mt==='tv' ? `https://vidcore.org/embed/series/${id}/${s}/${e}` : `https://vidcore.org/embed/movie/${id}`,
  (id,mt,s,e) => mt==='tv' ? `https://vidsrc.cc/embed/tv/${id}/${s}/${e}` : `https://vidsrc.cc/embed/movie/${id}`,
  (id,mt,s,e) => mt==='tv' ? `https://2embed.skin/embedtv/${id}&s=${s}&e=${e}` : `https://2embed.skin/embed/${id}`,
];

// ===== STATE =====
let curSrc=0, curS=1, curE=1, curPlayer=null, curAll=[], catItems={};

const $=id=>document.getElementById(id);

// ===== RENDER =====
function renderGrid(items,title){
  const c=$('content');
  let html=`<div class="sh"><span class="st">${title}</span></div><div class="grid-wrap"><div class="grid">`;
  items.forEach(item=>{
    const t=item.title||'';
    const y=item.year||'';
    const p=item.poster||'https://via.placeholder.com/300x450/111115/888?text=No+Poster';
    const badge=item.type==='series'||item.type==='tv'?'Series':'Movie';
    html+=`<div class="card" onclick="openItem(${item.id})">
      <img src="${p}" alt="${t}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/111115/888?text=${encodeURIComponent(t.slice(0,8))}'"/>
      <div class="card-badge">${badge}</div>
      <div class="card-play">▶</div>
      <div class="card-info"><div class="card-title">${t}</div>${y?`<div class="card-year">${y}</div>`:''}</div>
    </div>`;
  });
  html+=`</div></div>`;
  c.innerHTML=html;
}

// ===== DATA =====
const ALL=[...MOVIES,...SERIES];

function getCat(c){
  if(c==='home') return [...MOVIES].slice(0,18);
  if(c==='movies') return MOVIES.filter(x=>x.type==='movie');
  if(c==='series') return SERIES;
  return MOVIES.filter(x=>x.type===c);
}

// ===== NAV =====
function goTo(cat){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.cat===cat));
  document.querySelectorAll('.bn').forEach(t=>t.classList.toggle('on',t.dataset.cat===cat));
  document.title=cat==='home'?'RootFlik — Free Stream':`RootFlik — ${cat.charAt(0).toUpperCase()+cat.slice(1)}`;
  const items=getCat(cat);
  const names={home:'🔥 Featured',movies:'🎬 Movies',series:'📺 Series',action:'💥 Action',comedy:'😂 Comedy','sci-fi':'🚀 Sci-Fi',bollywood:'🇮🇳 Bollywood'};
  renderGrid(items,names[cat]||'Browse');
}

// ===== OPEN PLAYER =====
function openItem(id){
  const item=[...MOVIES,...SERIES].find(x=>x.id===id);
  if(!item) return;
  curPlayer=item;
  curS=1; curE=1; curSrc=0;
  const isSeries=item.type==='series'||item.type==='tv';
  $('pl-title').textContent=item.title;
  $('pl-sub').textContent=isSeries?'Series':'Movie';
  document.querySelectorAll('.src-btn').forEach((b,i)=>b.classList.toggle('on',i===0));
  
  if(isSeries){
    $('ep-bar').style.display='flex';
    buildEpSelect(item);
  } else {
    $('ep-bar').style.display='none';
  }
  
  loadIframe();
  $('pg-player').classList.add('on');
  document.body.style.overflow='hidden';
}

function buildEpSelect(item){
  const ss=$('s-sel'); ss.innerHTML='';
  for(let s=1; s<=item.seasons; s++){
    const o=document.createElement('option'); o.value=s; o.textContent='Season '+s; ss.appendChild(o);
  }
  curS=1; ss.value=1;
  updateEpSelect(item);
}

function updateEpSelect(item){
  const es=$('e-sel'); es.innerHTML='';
  const total=item.eps[curS-1]||10;
  for(let e=1; e<=total; e++){
    const o=document.createElement('option'); o.value=e; o.textContent='Ep '+e; es.appendChild(o);
  }
  curE=1; es.value=1;
}

function onSChange(){curS=parseInt($('s-sel').value);updateEpSelect(curPlayer);loadIframe()}
function onEChange(){curE=parseInt($('e-sel').value);loadIframe()}
function prevEp(){if(curE>1){curE--;$('e-sel').value=curE;loadIframe()}}
function nextEp(){const max=curPlayer.eps[curS-1]||10;if(curE<max){curE++;$('e-sel').value=curE;loadIframe()}}

function loadIframe(){
  const item=curPlayer; if(!item) return;
  const f=$('pl-iframe'); f.src='about:blank';
  const isTV=item.type==='series'||item.type==='tv';
  const mt=isTV?'tv':'movie';
  const id=item.embed;
  setTimeout(()=>{f.src=SRV[curSrc](id,mt,isTV?curS:null,isTV?curE:null)},100);
}

function switchSrc(idx){
  curSrc=idx;
  document.querySelectorAll('.src-btn').forEach((b,i)=>b.classList.toggle('on',i===idx));
  loadIframe();
}

function closePlayer(){
  $('pg-player').classList.remove('on');
  $('pl-iframe').src='about:blank';
  document.body.style.overflow='';
}

// ===== SEARCH =====
$('srch').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  if(!q){goTo('home');return}
  const results=ALL.filter(x=>x.title.toLowerCase().includes(q)).slice(0,20);
  renderGrid(results,`🔍 Results for "${q}"`);
});

// ===== EVENT BINDING =====
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>goTo(t.dataset.cat)));
document.querySelectorAll('.bn').forEach(t=>t.addEventListener('click',()=>goTo(t.dataset.cat)));

// ===== INIT =====
goTo('home');
</script>
</body>
</html>
